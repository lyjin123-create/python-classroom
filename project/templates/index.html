<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 할 일 관리 (Todo App)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card">
        <!-- 헤더 섹션 -->
        <header class="header">
            <div class="title-wrap">
                <span class="icon">✨</span>
                <h1>나의 할 일 플래너</h1>
            </div>
            <p class="subtitle">오늘 해야 할 일들을 체계적으로 관리해보세요.</p>
        </header>

        <!-- 진행 상황 게이지 -->
        <section class="progress-section">
            <div class="progress-meta">
                <span>달성률</span>
                <span class="percent">{{ rate }}%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: {{ rate }}%;"></div>
            </div>
            <div class="stats-text">
                총 {{ total }}건 중 <strong>{{ done_cnt }}건 완료</strong>
            </div>
        </section>

        <!-- 할 일 등록 폼 (CREATE) -->
        <form class="todo-form" action="/add" method="POST">
            <select name="category" class="category-select">
                <option value="업무">💼 업무</option>
                <option value="개인" selected>👤 개인</option>
                <option value="공부">📚 공부</option>
                <option value="운동">🏃 운동</option>
            </select>
            <input type="text" name="title" class="todo-input" placeholder="새로운 할 일을 입력하세요..." required autofocus>
            <button type="submit" class="btn-submit">추가</button>
        </form>

        <!-- 할 일 목록 (READ) -->
        <ul class="todo-list">
            {% for todo in todos %}
                <li class="todo-item {% if todo.done %}is-done{% endif %}">
                    <div class="todo-main">
                        <!-- 완료 토글 버튼 (UPDATE) -->
                        <form action="/toggle/{{ todo.id }}" method="POST" class="inline-form">
                            <button type="submit" class="checkbox-btn" title="완료 여부 변경">
                                {% if todo.done %}✓{% endif %}
                            </button>
                        </form>
                        
                        <div class="content-group">
                            <span class="badge badge-{{ todo.category }}">{{ todo.category }}</span>
                            <span class="todo-text">{{ todo.title }}</span>
                        </div>
                    </div>

                    <!-- 삭제 버튼 (DELETE) -->
                    <form action="/delete/{{ todo.id }}" method="POST" class="inline-form">
                        <button type="submit" class="btn-delete" title="삭제" onclick="return confirm('이 할 일을 삭제하시겠습니까?');">
                            🗑️
                        </button>
                    </form>
                </li>
            {% else %}
                <li class="empty-state">
                    <p class="empty-icon">🎉</p>
                    <p>등록된 할 일이 없습니다!<br>새로운 목표를 추가해보세요.</p>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
